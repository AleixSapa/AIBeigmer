<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AIBeigmer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside class="sidebar">
    <h1>AIBeigmer</h1>
    <nav>
      <a class="active" href="#dashboard">🏠 Dashboard</a>
      <a href="#models">🤖 Models</a>
      <a href="#benchmarks">🧪 Benchmarks</a>
      <a href="#execute">▶ Executar</a>
      <a href="#results">📊 Resultats</a>
      <a href="#compare">⚖️ Comparar</a>
      <a href="#ranking">🏆 Rànquing</a>
      <a href="#settings">⚙️ Configuració</a>
    </nav>
  </aside>
  <main>
    <header><span>AI model benchmarking</span><span id="status">Connectant...</span></header>
    <section id="dashboard">
      <h2>Dashboard</h2>
      <div class="cards">
        <article><small>Puntuació mitjana</small><strong id="avg-score">—</strong></article>
        <article><small>Model líder</small><strong id="leader">—</strong></article>
        <article><small>Execucions</small><strong id="runs">—</strong></article>
        <article><small>Millor velocitat</small><strong id="fastest">—</strong></article>
      </div>
      <div class="panel"><h3>Categories</h3><div id="categories">Carregant...</div></div>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
